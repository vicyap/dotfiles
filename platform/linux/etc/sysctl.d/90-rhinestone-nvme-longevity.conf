# Batch writeback to reduce NVMe write amplification while retaining the
# five-minute periodic sync safety net.
vm.dirty_background_bytes = 2147483648
vm.dirty_bytes = 4294967296
vm.dirty_writeback_centisecs = 4500
vm.dirty_expire_centisecs = 6000

# Use the kernel default balance between dentry/inode cache and page cache.
vm.vfs_cache_pressure = 100
