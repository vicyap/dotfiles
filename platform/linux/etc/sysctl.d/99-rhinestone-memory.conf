# rhinestone memory tuning — see the 2026-06-17 memory-pressure postmortem.
#
# swappiness=30: reclaim cold anonymous pages into zram before memory pressure
# reaches earlyoom's joint RAM/swap threshold while preferring resident RAM.
# zram has priority over the disk swapfile, which remains the slow fallback.
#
# page-cluster=0: single-page swap readahead — best for RAM-backed zram and
# random swapfile access (no spinning-disk locality to exploit).
vm.swappiness = 30
vm.page-cluster = 0
