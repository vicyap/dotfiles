# Keep sshd's working set resident during memory-reclaim storms so logins
# still work in the window before earlyoom acts. With vm.swappiness=0 the
# kernel's only reclaim option is evicting file pages — including sshd's own
# code — which is what makes the box unreachable while nothing is killed.
# Effective only because system.slice allocates a matching protection (see
# system.slice.d/10-access-memorymin.conf).
#
# Deliberately no OOMScoreAdjust here: sshd already sets -1000 on its listener
# and restores children to the value it saw at startup, so a unit-level
# -1000 would leak to every SSH session and make user workloads unkillable.
[Service]
MemoryMin=128M
