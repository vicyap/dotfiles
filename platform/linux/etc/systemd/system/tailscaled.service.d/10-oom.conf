# Keep tailscaled alive through memory pressure so the tailnet (and Tailscale
# SSH) remains an access path during OOM events. sshd already self-protects
# its listener at -1000; tailscaled has no such mechanism.
#
# Tailscale SSH sessions inherit this value because tailscaled never resets
# oom_score_adj for the shells it spawns; /etc/zsh/zshenv resets them to 0 so
# workloads started over Tailscale SSH stay killable.
# MemoryMin keeps the daemon's working set resident during reclaim storms so
# the tailnet stays responsive in the window before earlyoom acts. Effective
# only because system.slice allocates a matching protection (see
# system.slice.d/10-access-memorymin.conf).
[Service]
OOMScoreAdjust=-1000
MemoryMin=128M
