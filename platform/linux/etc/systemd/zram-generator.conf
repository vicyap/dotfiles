# zram — compressed RAM-backed swap as the fast first tier of an emergency
# memory cushion. See the 2026-06-17 memory-pressure postmortem. rhinestone-only.
#
# vm.swappiness=20 lets cold anonymous pages move here before near-OOM. zram's
# higher swap priority keeps the disk swapfile as the slow fallback, so memory
# pressure degrades gracefully instead of livelocking the box.
[zram0]
zram-size = min(ram / 2, 16384)
compression-algorithm = zstd
