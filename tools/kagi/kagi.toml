# Kagi search settings as code. This file is the full truth: `kagi apply`
# creates, updates, and deletes account resources until the account matches.
#
# Design: lenses are exclude-only so search keeps its discovery value. Sites
# you already trust are raised globally under [ranked] instead of fenced into
# an allowlist. Lowered sites remain discoverable globally; each lens excludes
# only selected domains, without keyword filters.

[ranked]
block = []
lower = [
  "dev.to",
  "medium.com",
  "geeksforgeeks.org",
  "tutorialspoint.com",
  "bestreviews.guide",
  "top10.com",
  "consumersadvocate.org",
  "reviews.org",
  "hashnode.dev",
  "freecodecamp.org",
]
# Ranked above equals everywhere. Practitioner blogs and price/review sources.
raise = [
  "simonwillison.net",
  "martinfowler.com",
  "camelcamelcamel.com",
  "reddit.com",
  "news.ycombinator.com",
  "lobste.rs",
  "rtings.com",
  "developer.mozilla.org",
]
# NYT/Wirecutter and NapLab remain neutral.
pin = []

# Built-in lenses by the name shown on kagi.com/settings/lenses.
# Only listed lenses are enabled; all other built-ins are switched off on apply.
[builtin_lenses]
enabled = [
  "Forums",
  "Programming",
  "PDFs",
  "Small Web",
  "Recipes",
]

[[lens]]
name = "Product Search"
exclude_domains = [
  "bestreviews.guide",
  "top10.com",
]

[[lens]]
name = "Engineering Blogs"
exclude_domains = [
  "dev.to",
  "medium.com",
  "geeksforgeeks.org",
  "tutorialspoint.com",
]

# Assistants need a model id; Kagi rejects an empty one. `ki_research` is the
# Kagi Research model, the account default when this file was written. Other
# ids: ki_quick, claude-5-sonnet, claude-5-opus, gpt-6-astra, gemini-3-pro.
# `bang` is typed after `!` in the search box to start a thread with it.
[[assistant]]
name = "Product Compare"
lens = "Product Search"
model = "ki_research"
bang = "compare"
instructions = """
Compare exact product models using cited specifications, measured tests,
prices, durability, repairability, warranty terms, and owner complaints.
Default to US availability and USD. Before researching, check whether the exact
models and material requirements are clear. If model variants, sizes, generations,
or other missing details materially affect the comparison, respond only with
concise clarification questions and wait for the user's answer. Do not assume
a variant or begin a comparison while waiting. Honor the bound lens's domain
exclusions in searches and citations. Cite sources for specifications
and prices, including where and when each price was seen. Flag anything you
could not verify instead of guessing.

Separate manufacturer claims, independent test measurements, and owner anecdotes.
Self-selected owner polls and complaints are not representative failure rates;
do not turn them into a buyer's failure probability or infer blanket warranty
exclusions from individual claim denials. Verify coverage in the warranty terms.
Evaluate affiliate articles by their evidence; scrutinize recommendations and
disclosed incentives. Never assert undisclosed payments. Explain concrete
tradeoffs and finish with a compact comparison table and a conditional
recommendation based on the user's needs.
"""

[[assistant]]
name = "Engineering Research"
lens = "Engineering Blogs"
model = "ki_research"
bang = "engblogs"
instructions = """
Prioritize firsthand engineering experience, maintainability, architecture,
postmortems, and substantive technical explanations, including agent workflows.
Name the authors and cite original sources. Distinguish evidence from opinion
and honor the bound lens's domain exclusions in searches and citations.
Explain concrete examples and tradeoffs, including the context in which
an approach works or fails. Treat forum discussions as leads to corroborate
with original sources, not as established evidence. Flag uncertainty and
unsupported claims instead of guessing.
"""
